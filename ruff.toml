# ruff 0.17.2: uvx ruff@0.17.2 check . и uvx ruff@0.17.2 format --check . из корня репозитория
target-version = "py314"
line-length = 100

# К стандартным исключениям ruff (.venv, node_modules, .git и т. д.) — явно
extend-exclude = ["node_modules", ".venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",   # Depends()/Query() в значениях по умолчанию — штатный приём FastAPI
    "UP042",  # class X(str, Enum) -> StrEnum: меняет str()/format() у значений enum
]
# E402 в tests/conftest.py не отключаем: импорты там после os.environ[...] = ...
# (приложение читает окружение при импорте), а присваивания os.environ ruff сам не считает нарушением

[lint.isort]
known-first-party = ["app"]
