# Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ser-auth
  namespace: freelance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ser-auth
  template:
    metadata:
      labels:
        app: ser-auth
    spec:
      # Миграции до старта приложения: тот же образ и env, что у ser-auth (env.py читает настройки сервиса).
      # Временное решение, в 1.4 заменяется на Job
      initContainers:
      - name: migrate
        image: ser-auth:latest
        imagePullPolicy: Never
        command: ["alembic", "upgrade", "head"]
        env:
        - name: AUTH_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: auth-user
        - name: AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: auth-password
        - name: DATABASE_URL
          value: "postgresql+psycopg://auth_user:auth_password@auth-db:5432/auth_db"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: secret-key
        - name: ALGORITHM
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: algorithm
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: access-token-expire-minutes
      containers:
      - name: ser-auth
        image: ser-auth:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: AUTH_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: auth-user
        - name: AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: auth-password
        - name: DATABASE_URL
          value: "postgresql+psycopg://auth_user:auth_password@auth-db:5432/auth_db"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: secret-key
        - name: ALGORITHM
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: algorithm
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: access-token-expire-minutes
        livenessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ser-auth
  namespace: freelance-service
spec:
  selector:
    app: ser-auth
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  type: ClusterIP
---
# Task Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ser-task
  namespace: freelance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ser-task
  template:
    metadata:
      labels:
        app: ser-task
    spec:
      containers:
      - name: ser-task
        image: ser-task:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
          name: http
        env:
        - name: TASK_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: task-user
        - name: TASK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: task-password
        - name: DATABASE_URL
          value: "postgresql+psycopg://task_user:task_password@task-db:5432/task_db"
        - name: TIME_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: time-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: secret-key
        - name: ALGORITHM
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: algorithm
        livenessProbe:
          httpGet:
            path: /
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ser-task
  namespace: freelance-service
spec:
  selector:
    app: ser-task
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: http
  type: ClusterIP
