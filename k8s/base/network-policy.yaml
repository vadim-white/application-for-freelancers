# Default deny, дальше политика на под; связь описывают обе стороны. Порты — контейнера, а не Service:
# пакет проверяется после DNAT. Вход Envoy и seed — в overlay; probes kubelet политики не ограничивают.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: freelance-service
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# DNS всем подам: kube-dns (CoreDNS) в kube-system. Namespace — по метке kubernetes.io/metadata.name:
# её ставит API-сервер, подделать или забыть её нельзя (в отличие от самописной метки).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: freelance-service
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# Фронт: принимает только вход (overlay), ходит только в gateway (nginx проксирует /api)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ser-frontend
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: ser-frontend
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: ser-gateway
    ports:
    - protocol: TCP
      port: 8000
---
# API Gateway: принимает от фронта (и от входа — overlay), ходит в auth, task, time
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ser-gateway
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: ser-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ser-frontend
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: ser-auth
    ports:
    - protocol: TCP
      port: 8001
  - to:
    - podSelector:
        matchLabels:
          app: ser-task
    ports:
    - protocol: TCP
      port: 8002
  - to:
    - podSelector:
        matchLabels:
          app: ser-time
    ports:
    - protocol: TCP
      port: 8003
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ser-auth
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: ser-auth
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ser-gateway
    ports:
    - protocol: TCP
      port: 8001
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: auth-db
    ports:
    - protocol: TCP
      port: 5432
---
# task ↔ time в обе стороны: task берёт у time статистику, time у task проверяет задачу при старте
# таймера. Вызовы не вложены друг в друга (обработчик одного не ждёт другой) — взаимной блокировки нет.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ser-task
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: ser-task
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ser-gateway
    - podSelector:
        matchLabels:
          app: ser-time
    ports:
    - protocol: TCP
      port: 8002
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: task-db
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: ser-time
    ports:
    - protocol: TCP
      port: 8003
---
# time: принимает от gateway и task, ходит в свою базу и в task (связь task ↔ time — у ser-task)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ser-time
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: ser-time
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ser-gateway
    - podSelector:
        matchLabels:
          app: ser-task
    ports:
    - protocol: TCP
      port: 8003
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: time-db
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: ser-task
    ports:
    - protocol: TCP
      port: 8002
---
# Базы: принимают только свой сервис и его Job миграций (auth-db ещё seed — overlay local-seed),
# сами никуда не ходят (egress закрыт default-deny-all, кроме DNS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-db
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: auth-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ser-auth
    - podSelector:
        matchLabels:
          app: auth-migrate
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-db
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: task-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ser-task
    - podSelector:
        matchLabels:
          app: task-migrate
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: time-db
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: time-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ser-time
    - podSelector:
        matchLabels:
          app: time-migrate
    ports:
    - protocol: TCP
      port: 5432
---
# Job миграций (migrations.yaml): только своя база
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-migrate
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: auth-migrate
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: auth-db
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-migrate
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: task-migrate
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: task-db
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: time-migrate
  namespace: freelance-service
spec:
  podSelector:
    matchLabels:
      app: time-migrate
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: time-db
    ports:
    - protocol: TCP
      port: 5432
