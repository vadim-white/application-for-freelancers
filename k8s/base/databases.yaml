# PostgreSQL для Auth Service
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  namespace: freelance-service
spec:
  serviceName: auth-db
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      # PSA restricted: postgres сразу от uid 70 (postgres в alpine), а не root с понижением в entrypoint;
      # fsGroup — группа 70 на томах, где драйвер это поддерживает (local-path/hostPath — нет, там каталог 0777)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:15-alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "auth_db"
        - name: POSTGRES_USER
          value: "auth_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: AUTH_DB_PASSWORD
        # Подпапка тома: на облачных дисках в корне тома лежит lost+found, initdb в непустой каталог не пишет
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: auth-db-storage
          mountPath: /var/lib/postgresql/data
        # корень только на чтение: сокет и lock-файл — в /var/run/postgresql, временные файлы утилит (psql, initdb) — в /tmp
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: auth-db-storage
        persistentVolumeClaim:
          claimName: auth-db-pvc
      - name: run
        emptyDir:
          sizeLimit: 1Mi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: freelance-service
spec:
  clusterIP: None
  selector:
    app: auth-db
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
---
