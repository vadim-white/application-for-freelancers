# Gateway Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ser-gateway
  namespace: freelance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ser-gateway
  template:
    metadata:
      labels:
        app: ser-gateway
    spec:
      containers:
      - name: ser-gateway
        image: ser-gateway:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: AUTH_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: auth-url
        - name: TASK_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: task-url
        - name: TIME_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: time-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECRET_KEY
        - name: ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: algorithm
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ser-gateway
  namespace: freelance-service
spec:
  selector:
    app: ser-gateway
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  type: LoadBalancer
---
# Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ser-frontend
  namespace: freelance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ser-frontend
  template:
    metadata:
      labels:
        app: ser-frontend
    spec:
      containers:
      - name: ser-frontend
        image: ser-frontend:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        # полное имя: resolver nginx не применяет search-домены из resolv.conf (короткое имя даёт 502)
        - name: GATEWAY_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: gateway-url
        startupProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ser-frontend
  namespace: freelance-service
spec:
  selector:
    app: ser-frontend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
