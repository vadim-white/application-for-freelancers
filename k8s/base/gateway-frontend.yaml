# Gateway Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ser-gateway
  namespace: freelance-service
spec:
  # replicas задаёт HPA (hpa.yaml)
  selector:
    matchLabels:
      app: ser-gateway
  template:
    metadata:
      labels:
        app: ser-gateway
    spec:
      # PSA restricted: не root (USER 10001 в образе), без токена API k8s, только чтение корня
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # 30 с: preStop 5 + до 20 с дообработки в uvicorn (--timeout-graceful-shutdown в образе), потом SIGKILL
      terminationGracePeriodSeconds: 30
      containers:
      - name: ser-gateway
        image: ser-gateway:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: AUTH_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: auth-url
        - name: TASK_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: task-url
        - name: TIME_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: time-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECRET_KEY
        - name: ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: algorithm
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: cors-origins
        # запас на холодный старт под нагрузкой узла; liveness/readiness ждут её, initialDelaySeconds не нужен
        startupProbe:
          httpGet:
            path: /
            port: 8000
          periodSeconds: 2
          failureThreshold: 30
        # 6 неудач (60 с): перезапуск дороже снятия с трафика
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        # /ready не проверяет сервисы: иначе один упавший сервис снимал бы с трафика весь gateway
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 3
        # SIGTERM только через 5 с: Envoy и kube-proxy ещё шлют запросы на под, пока не увидят его удаление
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        # без лимита CPU: троттлинг на 200m валил пробы под нагрузкой узла
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ser-gateway
  namespace: freelance-service
spec:
  selector:
    app: ser-gateway
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  # наружу не публикуется: вход — Gateway (entrypoint.yaml)
  type: ClusterIP
---
# Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ser-frontend
  namespace: freelance-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ser-frontend
  template:
    metadata:
      labels:
        app: ser-frontend
    spec:
      # PSA restricted: nginx-unprivileged (uid 101), корень только на чтение; пишет nginx только в emptyDir ниже
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # 30 с: preStop 5 + дообработка; STOPSIGNAL образа SIGQUIT — nginx завершает начатые запросы
      terminationGracePeriodSeconds: 30
      containers:
      - name: ser-frontend
        image: ser-frontend:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: http
        env:
        # полное имя: resolver nginx не применяет search-домены из resolv.conf (короткое имя даёт 502)
        - name: GATEWAY_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: gateway-url
        startupProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 2
          failureThreshold: 30
        # 6 неудач (60 с): перезапуск дороже снятия с трафика
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
        # SIGTERM только через 5 с: Envoy и kube-proxy ещё шлют запросы на под, пока не увидят его удаление
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        volumeMounts:
        # pid и *_temp_path nginx-unprivileged
        - name: tmp
          mountPath: /tmp
        # 20-envsubst-on-templates.sh кладёт сюда default.conf из шаблона при старте
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
        # без лимита CPU: троттлинг на 200m валил пробы под нагрузкой узла
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: nginx-conf
        emptyDir:
          sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ser-frontend
  namespace: freelance-service
spec:
  selector:
    app: ser-frontend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
