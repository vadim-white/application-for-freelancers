# Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ser-auth
  namespace: freelance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ser-auth
  template:
    metadata:
      labels:
        app: ser-auth
    spec:
      # схему БД создаёт Job auth-migrate (migrations.yaml), сервис его не ждёт: порядок задаёт k8s-deploy.sh
      containers:
      - name: ser-auth
        image: ser-auth:latest
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: AUTH_DB_PASSWORD
        - name: DATABASE_URL
          value: "postgresql+psycopg://auth_user:$(DB_PASSWORD)@auth-db:5432/auth_db"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECRET_KEY
        - name: ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: algorithm
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: access-token-expire-minutes
        livenessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ser-auth
  namespace: freelance-service
spec:
  selector:
    app: ser-auth
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  type: ClusterIP
---
