# Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ser-auth
  namespace: freelance-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ser-auth
  template:
    metadata:
      labels:
        app: ser-auth
    spec:
      # схему БД создаёт Job auth-migrate (migrations.yaml); до неё /ready отвечает 503 и трафика на под нет
      # PSA restricted: не root (USER 10001 в образе), без токена API k8s, только чтение корня
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # 30 с: preStop 5 + до 20 с дообработки в uvicorn (--timeout-graceful-shutdown в образе), потом SIGKILL
      terminationGracePeriodSeconds: 30
      containers:
      - name: ser-auth
        image: ser-auth:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: AUTH_DB_PASSWORD
        - name: DATABASE_URL
          value: "postgresql+psycopg://auth_user:$(DB_PASSWORD)@auth-db:5432/auth_db"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECRET_KEY
        - name: ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: algorithm
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: access-token-expire-minutes
        # запас на холодный старт под нагрузкой узла; liveness/readiness ждут её, initialDelaySeconds не нужен
        startupProbe:
          httpGet:
            path: /
            port: 8001
          periodSeconds: 2
          failureThreshold: 30
        # liveness без БД: перезапуск не чинит упавшую базу; 6 неудач (60 с) — перезапуск дороже снятия с трафика
        livenessProbe:
          httpGet:
            path: /
            port: 8001
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        # readiness: база доступна и схема не старше кода (иначе 503 — под вне балансировки)
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          periodSeconds: 5
          timeoutSeconds: 3
        # SIGTERM только через 5 с: Envoy и kube-proxy ещё шлют запросы на под, пока не увидят его удаление
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        # без лимита CPU: троттлинг на 200m растягивал вход (bcrypt) до ~2,5 с и валил пробы под нагрузкой
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ser-auth
  namespace: freelance-service
spec:
  selector:
    app: ser-auth
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  type: ClusterIP
---
