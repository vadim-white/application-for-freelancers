apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: freelance-service-netpol
  namespace: freelance-service
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: freelance-service
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: freelance-service
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
