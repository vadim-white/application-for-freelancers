# Локальный кластер kind. Секреты — из app.env и db.env (создаёт scripts/init-k8s-env.sh, в git не попадают).
# Применять через scripts/k8s-deploy.sh: он удаляет старые Job (неизменяемы), ждёт миграций и
# затем применяет ../local-seed (тестовые пользователи). Голый apply -k второй раз падает на изменённых Job.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: freelance-service
resources:
  - ../../base
  # вход: GatewayClass "freelance" (Envoy Gateway) + EnvoyProxy с NodePort 30080 под kind-config.yaml
  - gatewayclass.yaml
  # NetworkPolicy: вход к фронту и gateway от подов прокси Envoy (envoy-gateway-system)
  - network-policy-entry.yaml
# Два файла, а не один: envs переносит в Secret все ключи файла. Раздельно — в каждом Secret только свои
# ключи, и смена SECRET_KEY меняет хеш только у app-secrets (базы не перезапускаются).
secretGenerator:
  - name: app-secrets
    envs:
      - app.env
  - name: db-credentials
    envs:
      - db.env
patches:
  # образы ser-*:latest загружаются в узел через kind load (scripts/kind-up.sh), из реестра их не тянем
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # Job миграций (k8s/base/migrations.yaml) — те же образы ser-*:latest
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
