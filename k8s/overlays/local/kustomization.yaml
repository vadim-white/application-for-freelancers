# Секреты — из app.env и db.env (создаёт scripts/init-k8s-env.sh, вне git). Применять через
# scripts/k8s-deploy.sh: голый apply -k второй раз падает на изменённых Job, а seed нужен после миграций.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: freelance-service
resources:
  - ../../base
  # вход: GatewayClass "freelance" (Envoy Gateway) + EnvoyProxy с NodePort 30080 под kind-config.yaml
  - gatewayclass.yaml
  # NetworkPolicy: вход к фронту и gateway от подов прокси Envoy (envoy-gateway-system)
  - network-policy-entry.yaml
  # Envoy закрывает простаивающие соединения к бэкендам раньше, чем бэкенды (60 с < 75 с uvicorn)
  - backend-traffic-policy.yaml
# Два файла, а не один: envs переносит в Secret все ключи файла. Раздельно — в каждом Secret только свои
# ключи, и смена SECRET_KEY меняет хеш только у app-secrets (базы не перезапускаются).
secretGenerator:
  - name: app-secrets
    envs:
      - app.env
  - name: db-credentials
    envs:
      - db.env
patches:
  # образы загружает в узел kind-up.sh, тег подставляет k8s-deploy.sh (:latest — только в git); реестра нет
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # Job миграций — те же образы сервисов с тем же тегом
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
