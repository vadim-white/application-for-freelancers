# Здесь, а не в base: откуда приходит трафик входа, зависит от реализации GatewayClass.
# Две политики, а не одна: порты правила относятся ко всем выбранным подам — открыли бы фронту 8000, gateway 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entry-to-ser-frontend
  namespace: freelance-service
  labels:
    app.kubernetes.io/part-of: freelance-service
spec:
  podSelector:
    matchLabels:
      app: ser-frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    # один элемент с обоими селекторами — «И»: поды прокси именно в этом namespace
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/component: proxy
          gateway.envoyproxy.io/owning-gateway-name: entry
          gateway.envoyproxy.io/owning-gateway-namespace: freelance-service
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entry-to-ser-gateway
  namespace: freelance-service
  labels:
    app.kubernetes.io/part-of: freelance-service
spec:
  podSelector:
    matchLabels:
      app: ser-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/component: proxy
          gateway.envoyproxy.io/owning-gateway-name: entry
          gateway.envoyproxy.io/owning-gateway-namespace: freelance-service
    ports:
    - protocol: TCP
      port: 8000
