# Отдельный apply после auth-migrate: у Job нет depends_on. Соседний каталог, а не local/seed: kustomize
# запрещает ссылку на родителя. local подключён целиком — имена Secret'ов с хешем совпадут с применёнными.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: freelance-service
resources:
  - ../local
  - auth-seed.yaml
  # сеть seed → auth-db (обе стороны; остальное закрыто политиками base)
  - network-policy-seed.yaml
