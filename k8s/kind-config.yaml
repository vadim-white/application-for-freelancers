# Создаётся scripts/kind-up.sh, контекст kubectl — kind-freelance.
# Образ узла закреплён версией и digest (требование релиза kind v0.33.0).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: freelance
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    extraPortMappings:
      # вход в кластер: NodePort 30080 узла -> 127.0.0.1:8080 хоста
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
