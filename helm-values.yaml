# Default values for freelance-service Helm chart
# This is a YAML-formatted file.

namespace: Freelance service

# Image configuration
image:
  registry: docker.io
  pullPolicy: Never  # Для локального - Never, для cloud - IfNotPresent или Always

# Services replicas
replicas:
  auth: 2
  task: 2
  time: 2
  gateway: 2
  frontend: 2

# Database configuration
database:
  postgres:
    image: postgres:15-alpine
    storage: 2Gi
  
  auth:
    database: auth_db
    username: auth_user
    password: auth_password
  
  task:
    database: task_db
    username: task_user
    password: task_password
  
  time:
    database: time_db
    username: time_user
    password: time_password

# Application secrets
secrets:
  secretKey: "228"
  algorithm: "HS256"
  accessTokenExpireMinutes: "15"

# Service URLs
serviceUrls:
  auth: "http://ser-auth:8001"
  task: "http://ser-task:8002"
  time: "http://ser-time:8003"
  gateway: "http://ser-gateway:8000"

# Resource limits
resources:
  postgres:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  services:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  
  frontend:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Service configuration
service:
  gateway:
    type: LoadBalancer
    port: 8000
  
  frontend:
    type: LoadBalancer
    port: 5173

# Ingress configuration (optional, instead of LoadBalancer)
ingress:
  enabled: false
  host: "freelance-service.local"
  gateway: "gateway.freelance-service.local"
  frontend: "frontend.freelance-service.local"

# HPA configuration (Horizontal Pod Autoscaling)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Health checks
healthChecks:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Network Policy
networkPolicy:
  enabled: true

# Test users to initialize
testUsers:
  - email: admin@example.com
    password: password123
    fullName: Admin User
    role: admin
  - email: user1@example.com
    password: password123
    fullName: User One
    role: user
  - email: user2@example.com
    password: password123
    fullName: User Two
    role: user
