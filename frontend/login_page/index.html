<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Freelance Service — учёт времени по проектам и задачам" />
    <title>Freelance Service</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Тема до загрузки JS, без вспышки светлой: то же правило, что в src/stores/theme.ts.
         data-theme переключает CSS-переменные и color-scheme (tokensCss в src/styles/tokens.ts) -->
    <script>
      ;(function () {
        var theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {
          // localStorage недоступен (приватный режим) — как в системе
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
