# gitleaks v8.30.1 подхватывает этот файл из корня репозитория; правила — стандартные.
[extend]
useDefault = true

# Фиктивные ключи подписи JWT в тестах: длиной ≥ 32 байт они проходят порог энтропии generic-api-key.
# Значения точные, а не путь tests/: настоящий ключ, случайно попавший в тесты, gitleaks всё равно найдёт.
[[allowlists]]
description = "фиктивные JWT-ключи тестов"
regexes = ['''^(test|other)-secret-key-at-least-32-bytes-long$''']
