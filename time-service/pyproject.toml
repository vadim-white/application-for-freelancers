[project]
name = "time-service"
version = "0.1.0"
description = "Учёт времени"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.160.0",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyjwt==2.15.1",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
]

# зависимости только для тестов: uv sync ставит их по умолчанию, в образ не попадают (--no-dev)
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.16.0",
    "pytest-cov==7.1.0",
]

# сервис — приложение, а не библиотека: uv ставит только зависимости, сам проект не собирает
[tool.uv]
package = false

# порог покрытия срабатывает только с --cov (uv run pytest --cov=app); в addopts --cov не добавляем,
# чтобы запуск одного файла или теста не падал из-за порога. Замер 2026-10-18, пересмотреть при росте покрытия
[tool.coverage.report]
fail_under = 97
