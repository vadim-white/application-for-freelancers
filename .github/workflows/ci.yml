# Вывод `docker compose config` и `kubectl kustomize` содержит секреты: первый — только с --quiet,
# второй — только в pipe; значения маскируются сразу после генерации. set -x не включать.
# timeout-minutes compose и kind — в 3–5 раз больше первого прогона: запас на медленный раннер и сеть
# (репозиторий публичный, раннеры ubuntu-24.04 и ubuntu-24.04-arm — 4 vCPU).
# Права токена — contents: read; packages: write только у publish и publish-manifest (push в main).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash с -e и -o pipefail: падение kubectl kustomize в pipe роняет шаг
    shell: bash

env:
  UV_VERSION: "0.13.6"
  # sha256 uv-x86_64-unknown-linux-gnu.tar.gz релиза 0.13.6
  UV_CHECKSUM: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
  RUFF_VERSION: "0.17.3"
  # kubectl в пределах ±1 минорной от сервера kind (v1.35.8); на раннере kubectl 1.37
  KUBECTL_VERSION: v1.35.10
  KUBECTL_SHA256: c49a28f1f4efc4d475ed05f47f2ce8e563bf7bef69ed77fe1b924ea6d83b6327
  KIND_VERSION: v0.33.0
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # первый прогон: 10 с
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks проверяет всю историю
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: false
      - name: ruff check
        run: uvx "ruff@$RUFF_VERSION" check .
      - name: ruff format --check
        run: uvx "ruff@$RUFF_VERSION" format --check .
      - name: shellcheck (scripts, smoke, e2e run.sh)
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" scripts/*.sh tests/smoke.sh tests/e2e/run.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: gitleaks (вся история)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git --redact --no-banner --verbose /repo

  python:
    name: python (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # первый прогон: 25–40 с
    strategy:
      fail-fast: false
      matrix:
        service: [auth, task, time, gateway]
    services:
      # одноразовая база для тестов на PostgreSQL, вход без пароля; у gateway базы нет
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.service }}-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          python-version: "3.14"
          cache-dependency-glob: ${{ matrix.service }}-service/uv.lock
          cache-suffix: ${{ matrix.service }}
      - name: uv sync --locked
        run: uv sync --locked
      - name: pytest с покрытием (порог fail_under — в pyproject.toml)
        run: |
          uv run --locked pytest --cov=app -rs | tee "$RUNNER_TEMP/pytest.txt"
          # с PostgreSQL ни один тест не должен быть пропущен: skip значит, что база не подключилась
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/pytest.txt"; then
            echo "::error::есть пропущенные тесты, хотя TEST_POSTGRES_URL задана"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # первый прогон: 24 с
    defaults:
      run:
        shell: bash
        working-directory: frontend/login_page
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/login_page/.nvmrc
          cache: npm
          cache-dependency-path: frontend/login_page/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # первый прогон: 13 с
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: kubectl ${{ env.KUBECTL_VERSION }} (sha256)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: kubectl version --client
      - name: .env (init-env.sh) и маскирование
        run: |
          ./scripts/init-env.sh
          for key in SECRET_KEY AUTH_DB_PASSWORD TASK_DB_PASSWORD TIME_DB_PASSWORD; do
            value="$(grep "^$key=" .env | tail -n 1 | cut -d= -f2-)"
            [ -n "$value" ] || { echo "::error::$key в .env пуст"; exit 1; }
            echo "::add-mask::$value"
          done
      - name: docker compose config --quiet
        run: docker compose config --quiet
      - name: app.env, db.env (init-k8s-env.sh) и маскирование
        run: |
          ./scripts/init-k8s-env.sh
          while IFS= read -r line; do
            value="${line#*=}"
            [ -n "$value" ] || { echo "::error::${line%%=*} в app.env/db.env пуст"; exit 1; }
            echo "::add-mask::$value"
            # в Secret значения лежат в base64
            echo "::add-mask::$(printf '%s' "$value" | base64 -w0)"
          done < <(grep -hE '^[A-Za-z_][A-Za-z0-9_]*=' k8s/overlays/local/app.env k8s/overlays/local/db.env)
      - name: kubeconform (оба overlay)
        run: |
          for overlay in local local-seed; do
            echo "== k8s/overlays/$overlay"
            kubectl kustomize "k8s/overlays/$overlay" \
              | docker run --rm -i "$KUBECONFORM_IMAGE" \
                  -strict -summary -skip Gateway,GatewayClass,HTTPRoute,EnvoyProxy,BackendTrafficPolicy -
          done

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # первый прогон: 1 мин 51 с
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose version
      - name: .env (init-env.sh) и маскирование
        run: |
          ./scripts/init-env.sh
          for key in SECRET_KEY AUTH_DB_PASSWORD TASK_DB_PASSWORD TIME_DB_PASSWORD; do
            value="$(grep "^$key=" .env | tail -n 1 | cut -d= -f2-)"
            [ -n "$value" ] || { echo "::error::$key в .env пуст"; exit 1; }
            echo "::add-mask::$value"
          done
      - name: docker compose up --build -d --wait
        run: docker compose up --build -d --wait
      - name: smoke (184, http://localhost:5173)
        run: bash tests/smoke.sh
      - name: e2e (Playwright, http://127.0.0.1:5173)
        run: bash tests/e2e/run.sh
      - name: диагностика
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: артефакты e2e
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-compose
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: docker compose down -v
        if: always()
        run: docker compose down -v

  # Образы ser-*:<SHA 12> в GHCR — только push в main: в PR и у Dependabot токен только на чтение,
  # а непроверенный код в реестр не попадает. Сборка на каждой архитектуре своим раннером, без эмуляции:
  # amd64 — для CI, arm64 — для kind на Mac (Apple Silicon). Сторонних actions нет.
  publish:
    name: publish (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, python, frontend, static]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker login ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: сборка и публикация ser-*:<SHA 12>-${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # имя в реестре — только в нижнем регистре; тег — как в kind-up.sh (git rev-parse --short=12)
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tag="${GITHUB_SHA:0:12}-$ARCH"
          printf '### Образы %s\n\n| Образ | Digest |\n|---|---|\n' "$registry/ser-*:$tag" >> "$GITHUB_STEP_SUMMARY"
          # Dockerfile и контекст — те же, что в docker-compose.yml (build); секретов при сборке нет.
          # Метка source связывает пакет с репозиторием: публичный пакет kind скачивает без imagePullSecret
          for spec in auth:auth-service task:task-service time:time-service gateway:gateway-service frontend:frontend; do
            image="$registry/ser-${spec%%:*}:$tag"
            docker build -f "${spec#*:}/Dockerfile" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$image" .
            docker push "$image"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
            echo "| \`ser-${spec%%:*}\` | \`${digest#*@}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: docker logout ghcr.io
        if: always()
        run: docker logout ghcr.io

  # один тег <SHA 12> на обе архитектуры: узел берёт из индекса свою
  publish-manifest:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.manifest.outputs.registry }}
    steps:
      - name: docker login ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: индекс ser-*:<SHA 12> (amd64 + arm64)
        id: manifest
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tag="${GITHUB_SHA:0:12}"
          printf '### Образы %s (amd64 + arm64)\n\n| Образ | Digest индекса |\n|---|---|\n' "$registry/ser-*:$tag" >> "$GITHUB_STEP_SUMMARY"
          for name in auth task time gateway frontend; do
            image="$registry/ser-$name:$tag"
            docker buildx imagetools create -t "$image" "$image-amd64" "$image-arm64"
            digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
            echo "| \`ser-$name\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
      - name: docker logout ghcr.io
        if: always()
        run: docker logout ghcr.io

  kind:
    # На push в main — образы из GHCR (publish-manifest); если быстрые jobs упали, публикации нет и kind
    # не идёт. В PR и других ветках publish пропущен (skipped): kind собирает и грузит образы сам, как раньше.
    needs: publish-manifest
    if: >-
      !cancelled() && (needs.publish-manifest.result == 'success'
      || (needs.publish-manifest.result == 'skipped'
      && !(github.event_name == 'push' && github.ref == 'refs/heads/main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # первый прогон: 4 мин 13 с
    env:
      # kind-up.sh: пусто — сборка и kind load, иначе режим реестра (тег — SHA HEAD)
      IMAGE_REGISTRY: ${{ needs.publish-manifest.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: kubectl ${{ env.KUBECTL_VERSION }} (sha256)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: версии kubectl и kind
        run: |
          kubectl version --client
          actual="$(kind version | cut -d' ' -f2)"
          echo "kind $actual"
          [ "$actual" = "$KIND_VERSION" ] || { echo "::error::на раннере kind $actual, ожидается $KIND_VERSION"; exit 1; }
      - name: kind-up.sh (кластер, Envoy Gateway, образы или режим реестра)
        run: ./scripts/kind-up.sh
      - name: app.env, db.env (init-k8s-env.sh) и маскирование
        run: |
          ./scripts/init-k8s-env.sh
          while IFS= read -r line; do
            value="${line#*=}"
            [ -n "$value" ] || { echo "::error::${line%%=*} в app.env/db.env пуст"; exit 1; }
            echo "::add-mask::$value"
            echo "::add-mask::$(printf '%s' "$value" | base64 -w0)"
          done < <(grep -hE '^[A-Za-z_][A-Za-z0-9_]*=' k8s/overlays/local/app.env k8s/overlays/local/db.env)
      - name: k8s-deploy.sh
        run: ./scripts/k8s-deploy.sh
      # imageID — откуда узел взял образ; на main все ser-* должны прийти из GHCR, а не из kind load
      - name: образы подов
        run: |
          kubectl --context kind-freelance -n freelance-service get pods \
            -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.image}{" "}{.imageID}{"\n"}{end}{end}' \
            | sort -u | tee "$RUNNER_TEMP/images.txt"
          if [ -n "$IMAGE_REGISTRY" ]; then
            awk -v r="$IMAGE_REGISTRY/" '$1 !~ /^docker\.io\/library\/postgres:/ && (index($1, r) != 1 || index($2, r) != 1) {
              print "::error::образ не из реестра: " $0; bad = 1 } END { exit bad }' "$RUNNER_TEMP/images.txt"
          fi
      - name: smoke k8s (181)
        run: SMOKE_MODE=k8s bash tests/smoke.sh
      - name: e2e (Playwright, через вход http://127.0.0.1:8080)
        run: E2E_BASE_URL=http://127.0.0.1:8080 bash tests/e2e/run.sh
      # overlay с тегом из k8s-deploy.sh: шаблон пода Job неизменяем, с :latest из git patch отклоняется
      - name: apply --dry-run=server (оба overlay)
        run: |
          for overlay in app seed; do
            echo "== k8s/overlays/.deploy/$overlay"
            kubectl kustomize "k8s/overlays/.deploy/$overlay" \
              | kubectl --context kind-freelance apply --dry-run=server -f -
          done
      - name: диагностика
        if: failure()
        run: |
          k() { kubectl --context kind-freelance -n freelance-service "$@"; }
          k get pods,jobs -o wide || true
          k get deploy -o wide || true
          k get events --sort-by=.lastTimestamp || true
          k describe gateway entry || true
          kubectl --context kind-freelance -n envoy-gateway-system get pods -o wide || true
          for pod in $(k get pods -o name 2>/dev/null); do
            echo "::group::$pod"
            k logs "$pod" --all-containers --prefix --tail=100 || true
            k logs "$pod" --all-containers --prefix --tail=50 --previous 2>/dev/null || true
            echo "::endgroup::"
          done
          echo "::group::envoy-gateway"
          kubectl --context kind-freelance -n envoy-gateway-system logs deploy/envoy-gateway --tail=100 || true
          echo "::endgroup::"
      - name: артефакты e2e
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-kind
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
