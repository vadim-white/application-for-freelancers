# 127.0.0.1, а не localhost: uvicorn слушает только IPv4. start_interval — проверка раз в секунду
# на старте, чтобы up --wait не ждал лишних 10 с; test (GET /ready) задан у каждого сервиса
x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 20s
  start_interval: 1s

services:
  # PostgreSQL для Auth Service.
  # pg_isready с -d: без него проверка идёт к базе с именем пользователя, и postgres каждые 10 с пишет FATAL в лог
  ser-auth-db:
    image: postgres:15-alpine
    container_name: ser-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?задайте в .env (./scripts/init-env.sh)}
    volumes:
      - ser-auth-db-data:/var/lib/postgresql/data
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL для Task Service
  ser-task-db:
    image: postgres:15-alpine
    container_name: ser-task-db
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: ${TASK_DB_PASSWORD:?задайте в .env (./scripts/init-env.sh)}
    volumes:
      - ser-task-db-data:/var/lib/postgresql/data
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL для Time Service
  ser-time-db:
    image: postgres:15-alpine
    container_name: ser-time-db
    environment:
      POSTGRES_DB: time_db
      POSTGRES_USER: time_user
      POSTGRES_PASSWORD: ${TIME_DB_PASSWORD:?задайте в .env (./scripts/init-env.sh)}
    volumes:
      - ser-time-db-data:/var/lib/postgresql/data
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_user -d time_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gateway Service (точка входа)
  ser-gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    image: ser-gateway:latest
    container_name: ser-gateway
    # BIND_ADDR из .env: по умолчанию только 127.0.0.1 (см. .env.example)
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    environment:
      AUTH_URL: http://ser-auth:8001
      TASK_URL: http://ser-task:8002
      TIME_URL: http://ser-time:8003
      SECRET_KEY: ${SECRET_KEY:?задайте в .env (./scripts/init-env.sh)}
      ALGORITHM: ${ALGORITHM:-HS256}
      # откуда браузеру разрешены запросы (CORS), через запятую
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      ser-auth:
        condition: service_healthy
      ser-task:
        condition: service_healthy
      ser-time:
        condition: service_healthy
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]

  # Auth Service
  ser-auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: ser-auth:latest
    container_name: ser-auth
    expose:
      - "8001"
    # &auth-env: те же переменные нужны ser-auth-migrate и ser-auth-seed (они импортируют настройки сервиса)
    environment: &auth-env
      DATABASE_URL: postgresql+psycopg://auth_user:${AUTH_DB_PASSWORD:?задайте в .env (./scripts/init-env.sh)}@ser-auth-db:5432/auth_db
      SECRET_KEY: ${SECRET_KEY:?задайте в .env (./scripts/init-env.sh)}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
    depends_on:
      # таблицы создаёт миграция, тестовых пользователей — seed; приложение стартует после обоих
      ser-auth-migrate:
        condition: service_completed_successfully
      ser-auth-seed:
        condition: service_completed_successfully
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)"]

  # Миграции Auth Service: одноразовый запуск alembic upgrade head перед ser-auth
  ser-auth-migrate:
    image: ser-auth:latest
    container_name: ser-auth-migrate
    command: alembic upgrade head
    environment: *auth-env
    depends_on:
      ser-auth-db:
        condition: service_healthy
    networks:
      - ser-network
    restart: "no"

  # Тестовые пользователи Auth Service: одноразовый запуск python -m app.init_users после миграций.
  # При SEED_TEST_USERS=false пишет «пропущено» и завершается с кодом 0
  ser-auth-seed:
    image: ser-auth:latest
    container_name: ser-auth-seed
    command: python -m app.init_users
    environment:
      <<: *auth-env
      # только для разработки: admin@example.com, user1/user2@example.com с паролем password123.
      # Выключить: SEED_TEST_USERS=false docker compose up
      SEED_TEST_USERS: ${SEED_TEST_USERS:-true}
    depends_on:
      ser-auth-migrate:
        condition: service_completed_successfully
    networks:
      - ser-network
    restart: "no"

  # Task Service
  ser-task:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    image: ser-task:latest
    container_name: ser-task
    expose:
      - "8002"
    # &task-env: те же переменные нужны ser-task-migrate (env.py импортирует настройки сервиса)
    environment: &task-env
      DATABASE_URL: postgresql+psycopg://task_user:${TASK_DB_PASSWORD:?задайте в .env (./scripts/init-env.sh)}@ser-task-db:5432/task_db
      TIME_SERVICE_URL: http://ser-time:8003
      SECRET_KEY: ${SECRET_KEY:?задайте в .env (./scripts/init-env.sh)}
      ALGORITHM: ${ALGORITHM:-HS256}
    depends_on:
      # таблицы создаёт миграция, приложение стартует после её успешного завершения
      ser-task-migrate:
        condition: service_completed_successfully
      # статистика ходит в time
      ser-time:
        condition: service_healthy
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=2)"]

  # Миграции Task Service: одноразовый запуск alembic upgrade head перед ser-task
  ser-task-migrate:
    image: ser-task:latest
    container_name: ser-task-migrate
    command: alembic upgrade head
    environment: *task-env
    depends_on:
      ser-task-db:
        condition: service_healthy
    networks:
      - ser-network
    restart: "no"

  # Time Service
  ser-time:
    build:
      context: .
      dockerfile: time-service/Dockerfile
    image: ser-time:latest
    container_name: ser-time
    expose:
      - "8003"
    # &time-env: те же переменные нужны ser-time-migrate (env.py импортирует настройки сервиса)
    environment: &time-env
      DATABASE_URL: postgresql+psycopg://time_user:${TIME_DB_PASSWORD:?задайте в .env (./scripts/init-env.sh)}@ser-time-db:5432/time_db
      TASK_SERVICE_URL: http://ser-task:8002
      SECRET_KEY: ${SECRET_KEY:?задайте в .env (./scripts/init-env.sh)}
      ALGORITHM: ${ALGORITHM:-HS256}
    depends_on:
      # таблицы создаёт миграция, приложение стартует после её успешного завершения
      ser-time-migrate:
        condition: service_completed_successfully
      # ser-task не ждём: task уже ждёт time (статистика), обратная связь — цикл, compose его не запустит;
      # пока task не поднялся, старт таймера отвечает 503
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/ready', timeout=2)"]

  # Миграции Time Service: одноразовый запуск alembic upgrade head перед ser-time
  ser-time-migrate:
    image: ser-time:latest
    container_name: ser-time-migrate
    command: alembic upgrade head
    environment: *time-env
    depends_on:
      ser-time-db:
        condition: service_healthy
    networks:
      - ser-network
    restart: "no"

  # Frontend: собранный Vue за nginx (внутри 8080); /api/ nginx проксирует на gateway
  ser-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ser-frontend:latest
    container_name: ser-frontend
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5173:8080"
    environment:
      GATEWAY_URL: http://ser-gateway:8000
    depends_on:
      ser-gateway:
        condition: service_healthy
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]

volumes:
  ser-auth-db-data:
  ser-task-db-data:
  ser-time-db-data:

networks:
  ser-network:
    driver: bridge
