services:
  # PostgreSQL для Auth Service
  ser-auth-db:
    image: postgres:15-alpine
    container_name: ser-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    volumes:
      - ser-auth-db-data:/var/lib/postgresql/data
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL для Task Service
  ser-task-db:
    image: postgres:15-alpine
    container_name: ser-task-db
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
    volumes:
      - ser-task-db-data:/var/lib/postgresql/data
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL для Time Service
  ser-time-db:
    image: postgres:15-alpine
    container_name: ser-time-db
    environment:
      POSTGRES_DB: time_db
      POSTGRES_USER: time_user
      POSTGRES_PASSWORD: time_password
    volumes:
      - ser-time-db-data:/var/lib/postgresql/data
    networks:
      - ser-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gateway Service (главный точка входа)
  ser-gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    image: ser-gateway:latest
    container_name: ser-gateway
    ports:
      - "8000:8000"
    environment:
      AUTH_URL: http://ser-auth:8001
      TASK_URL: http://ser-task:8002
      TIME_URL: http://ser-time:8003
      SECRET_KEY: 228
      ALGORITHM: HS256
      # откуда браузеру разрешены запросы (CORS), через запятую
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - ser-auth
      - ser-task
      - ser-time
    networks:
      - ser-network
    restart: unless-stopped

  # Auth Service
  ser-auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: ser-auth:latest
    container_name: ser-auth
    expose:
      - "8001"
    # &auth-env: те же переменные нужны ser-auth-migrate (env.py импортирует настройки сервиса)
    environment: &auth-env
      DATABASE_URL: postgresql+psycopg://auth_user:auth_password@ser-auth-db:5432/auth_db
      SECRET_KEY: 228
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      # только для разработки: admin@example.com, user1/user2@example.com с паролем password123
      SEED_TEST_USERS: "true"
    depends_on:
      # таблицы создаёт миграция, приложение стартует после её успешного завершения
      ser-auth-migrate:
        condition: service_completed_successfully
    networks:
      - ser-network
    restart: unless-stopped

  # Миграции Auth Service: одноразовый запуск alembic upgrade head перед ser-auth
  ser-auth-migrate:
    image: ser-auth:latest
    container_name: ser-auth-migrate
    command: alembic upgrade head
    environment: *auth-env
    depends_on:
      ser-auth-db:
        condition: service_healthy
    networks:
      - ser-network
    restart: "no"

  # Task Service
  ser-task:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    image: ser-task:latest
    container_name: ser-task
    expose:
      - "8002"
    # &task-env: те же переменные нужны ser-task-migrate (env.py импортирует настройки сервиса)
    environment: &task-env
      DATABASE_URL: postgresql+psycopg://task_user:task_password@ser-task-db:5432/task_db
      TIME_SERVICE_URL: http://ser-time:8003
      SECRET_KEY: 228
      ALGORITHM: HS256
    depends_on:
      # таблицы создаёт миграция, приложение стартует после её успешного завершения
      ser-task-migrate:
        condition: service_completed_successfully
    networks:
      - ser-network
    restart: unless-stopped

  # Миграции Task Service: одноразовый запуск alembic upgrade head перед ser-task
  ser-task-migrate:
    image: ser-task:latest
    container_name: ser-task-migrate
    command: alembic upgrade head
    environment: *task-env
    depends_on:
      ser-task-db:
        condition: service_healthy
    networks:
      - ser-network
    restart: "no"

  # Time Service
  ser-time:
    build:
      context: .
      dockerfile: time-service/Dockerfile
    image: ser-time:latest
    container_name: ser-time
    expose:
      - "8003"
    # &time-env: те же переменные нужны ser-time-migrate (env.py импортирует настройки сервиса)
    environment: &time-env
      DATABASE_URL: postgresql+psycopg://time_user:time_password@ser-time-db:5432/time_db
      SECRET_KEY: 228
      ALGORITHM: HS256
    depends_on:
      # таблицы создаёт миграция, приложение стартует после её успешного завершения
      ser-time-migrate:
        condition: service_completed_successfully
    networks:
      - ser-network
    restart: unless-stopped

  # Миграции Time Service: одноразовый запуск alembic upgrade head перед ser-time
  ser-time-migrate:
    image: ser-time:latest
    container_name: ser-time-migrate
    command: alembic upgrade head
    environment: *time-env
    depends_on:
      ser-time-db:
        condition: service_healthy
    networks:
      - ser-network
    restart: "no"

  # Frontend (Vue)
  ser-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ser-frontend:latest
    container_name: ser-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - ser-gateway
    networks:
      - ser-network
    restart: unless-stopped

volumes:
  ser-auth-db-data:
  ser-task-db-data:
  ser-time-db-data:

networks:
  ser-network:
    driver: bridge
